<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon Web | Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <link rel="icon" href="/assets/images/dragonweb_icon.png">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-logo"><img src="/assets/images/dragonweb_icon.png" alt="Dragon Web Home"></a>
        <a href="announcements.html">Announcements</a>
        <a href="forums.html">Forums</a>
        <a href="studentstuff.html">Student Stuff</a>
        <div class="navbar-auth">
            <div id="user-profile" class="profile-container hidden">
                <span id="avatar-img" class="avatar"></span>
                <span id="user-greeting"></span>
            </div>
            <a id="login-link" href="login.html" class="nav-btn">Login / Sign Up</a>
            <button id="logout-btn" class="nav-btn hidden" onclick="logout()">Logout</button>
        </div>
    </nav>

    <section class="auth-section">
        <div class="auth-card">
            <h1 class="title auth-title">Need help with your password?</h1>
            <p class="subtitle">Password resets are handled by the Dragon Web team. Email us from the address on your account and we’ll help you regain access.</p>
            <a class="cta-button auth-submit" href="mailto:320087@hkis.edu.hk?subject=Dragon%20Web%20password%20help">Email the Dragon Web team</a>

            <p class="auth-switch"><a href="login.html">Back to log in</a></p>
        </div>
    </section>

    <script src="/assets/js/auth.js" defer></script>
</body>
</html>
