<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon Web | Student Stuff</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <link rel="stylesheet" href="/assets/css/studentstuff.css" />
    <link rel="icon" href="/assets/images/dragonweb_icon.png">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-logo"><img src="/assets/images/dragonweb_icon.png" alt="Dragon Web Home"></a>
        <a href="announcements.html">Announcements</a>
        <a href="forums.html">Forums</a>
        <a href="studentstuff.html">Student Stuff</a>
        <div class="navbar-auth">
            <div id="user-profile" class="profile-container hidden">
                <span id="avatar-img" class="avatar"></span>
                <span id="user-greeting"></span>
            </div>

            <a id="login-link" href="login.html" class="nav-btn">Login / Sign Up</a>
            <button id="logout-btn" class="nav-btn hidden" onclick="logout()">Logout</button>
        </div>
    </nav>

    <main class="schedule-page">
        <h1 class="title">Student Stuff</h1>
        <p class="subtitle" id="schedule-subtitle">Daily schedule</p>

        <div class="grade-toggle" role="group" aria-label="Grade">
            <button class="day-button" type="button" data-grade="6">Grade 6</button>
            <button class="day-button" type="button" data-grade="78">Grade 7/8</button>
        </div>

        <section class="schedule-group">
            <div class="schedule-nav">
                <button class="day-button nav-arrow" id="prev-day" type="button" aria-label="Previous school day">‹</button>
                <div>
                    <h2 class="schedule-title" id="schedule-date"></h2>
                    <p class="schedule-day" id="schedule-day"></p>
                </div>
                <button class="day-button nav-arrow" id="next-day" type="button" aria-label="Next school day">›</button>
            </div>
            <ul class="schedule-list" id="schedule-list"></ul>
            <p class="schedule-note">First bus leaves 3:15 · Late buses 4:20 &amp; 5:00</p>
            <div class="schedule-actions">
                <button class="day-button hidden" id="today-day" type="button">Back to today</button>
                <button class="day-button" id="edit-classes" type="button">Add my classes</button>
            </div>

            <form class="classes-form hidden" id="classes-form">
                <h3>My classes</h3>
                <p class="classes-hint" id="classes-hint"></p>
                <p class="form-error hidden" id="classes-error"></p>
                <div class="classes-fields" id="classes-fields"></div>
                <div class="schedule-actions">
                    <button class="day-button" id="cancel-classes" type="button">Cancel</button>
                    <button class="nav-btn" type="submit">Save classes</button>
                </div>
            </form>
        </section>
    </main>

    <div class="page-back">
        <a class="nav-btn" href="index.html">Go Back Home</a>
    </div>

    <script src="/assets/js/auth.js" defer></script>
    <script src="/assets/js/schedule.js" defer></script>
</body>
</html>
