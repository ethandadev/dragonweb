<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon Web | Forums</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <link rel="stylesheet" href="/assets/css/forums.css" />
    <link rel="icon" href="/assets/images/dragonweb_icon.png">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-logo"><img src="/assets/images/dragonweb_icon.png" alt="Dragon Web Home"></a>
        <a href="announcements.html">Announcements</a>
        <a href="forums.html">Forums</a>
        <a href="studentstuff.html">Student Stuff</a>
        <div class="navbar-auth">
            <div id="user-profile" class="profile-container hidden">
                <span id="avatar-img" class="avatar"></span>
                <span id="user-greeting"></span>
            </div>

            <a id="login-link" href="login.html" class="nav-btn">Login / Sign Up</a>
            <button id="logout-btn" class="nav-btn hidden" onclick="logout()">Logout</button>
        </div>f
    </nav>

    <main class="forum-page">
        <header class="forum-hero">
            <h1 class="title">Dragon Web Forums</h1>
            <p class="subtitle">See what other students are talking about.</p>
            <p id="create-post-prompt" class="forum-prompt">Loading your account...</p>
        </header>

        <section id="post-form-guard" class="composer hidden" aria-labelledby="composer-title">
            <div class="section-heading">
                <div>
                    <p class="eyebrow">Start a discussion</p>
                    <h2 id="composer-title">Create a new post</h2>
                </div>
                <button id="show-post-form-btn" class="nav-btn" type="button">Create New Post</button>
            </div>

            <form id="new-post-form" class="composer-form hidden">
                <label for="post-title">Discussion title</label>
                <input id="post-title" class="form-input" type="text" maxlength="120" placeholder="What would you like to discuss?" required>

                <label for="post-content">Your message</label>
                <textarea id="post-content" class="form-input" rows="6" maxlength="2000" placeholder="Share your thoughts, questions, or updates..." required></textarea>

                <label for="post-category">Topic</label>
                <select id="post-category" class="form-input">
                    <option>General</option>
                    <option>Academic</option>
                    <option>Student Life</option>
                    <option>Events</option>
                    <option>Help</option>
                </select>

                <label for="post-media">Add an image or video <span class="optional-label">Optional</span></label>
                <input id="post-media" class="file-input" type="file" accept="image/*,video/*">
                <p id="media-preview" class="media-preview hidden" aria-live="polite"></p>

                <button type="submit" class="nav-btn">Publish post</button>
            </form>
        </section>

        <section class="forum-controls" aria-label="Forum controls">
            <div class="search-field">
                <label for="forum-search">Search discussions</label>
                <input id="forum-search" class="form-input" type="search" placeholder="Search titles, messages, or authors...">
            </div>
            <div class="filter-row">
                <div class="category-filters" aria-label="Filter by category">
                    <button class="category-filter active" type="button" data-category="All">All</button>
                    <button class="category-filter" type="button" data-category="General">General</button>
                    <button class="category-filter" type="button" data-category="Academic">Academic</button>
                    <button class="category-filter" type="button" data-category="Student Life">Student Life</button>
                    <button class="category-filter" type="button" data-category="Events">Events</button>
                    <button class="category-filter" type="button" data-category="Help">Help</button>
                </div>
                <label class="sort-control" for="forum-sort">
                    Sort by
                    <select id="forum-sort" class="form-input">
                        <option value="newest">Newest</option>
                        <option value="popular">Most replies</option>
                    </select>
                </label>
            </div>
        </section>

        <p id="auth-notice" class="form-message hidden" role="status"></p>
        <div id="forum-posts-container" class="forum-feed" aria-live="polite">
            <p class="loading-state">Loading discussions...</p>
        </div>

        <div class="forum-footer">
            <a class="nav-btn" href="index.html">Go Back Home</a>
        </div>
    </main>

    <script src="/assets/js/auth.js" defer></script>
    <script src="/assets/js/forums.js" defer></script>
</body>
</html>
