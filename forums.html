<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon Web | Forums</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <link rel="stylesheet" href="/assets/css/forums.css" />
    <link rel="icon" href="/assets/images/dragonweb_icon.png">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-logo"><img src="/assets/images/dragonweb_icon.png" alt="Dragon Web Home"></a>
        <a href="announcements.html">Announcements</a>
        <a href="forums.html">Forums</a>
        <a href="studentstuff.html">Student Stuff</a>
        <div class="navbar-auth">
            <div id="user-profile" class="profile-container hidden">
                <span id="avatar-img" class="avatar"></span>
                <span id="user-greeting"></span>
            </div>

            <a id="login-link" href="login.html" class="nav-btn">Login / Sign Up</a>
            <button id="logout-btn" class="nav-btn hidden" onclick="logout()">Logout</button>
        </div>
    </nav>

    <!-- Updated Forum Section -->
    <main style="max-width: 800px; margin: 0 auto; padding: 20px;">
        <h1 class="title">Dragon Web Forums</h1>
        <p class="subtitle" style="text-align: center;">See what other students are talking about.</p>

        <!-- Form for creating a new post -->
        <div class="create-post-section" style="text-align: center; margin-bottom: 30px;">
            <button id="show-post-form-btn" class="nav-btn">Create New Post</button>
            
            <form id="new-post-form" class="hidden" style="margin-top: 15px; text-align: left;">
                <input type="text" id="post-title" placeholder="Discussion Title" required style="display: block; width: 100%; margin-bottom: 10px; padding: 10px; font-family: inherit;">
                <textarea id="post-content" placeholder="What's on your mind?" required style="display: block; width: 100%; margin-bottom: 10px; padding: 10px; min-height: 100px; font-family: inherit; resize: vertical;"></textarea>
                <button type="submit" class="nav-btn">Post</button>
            </form>
        </div>

        <!-- Container where JavaScript will load the posts -->
        <div id="forum-posts-container" class="forum-feed">
            <p style="text-align: center;">Loading posts...</p>
        </div>
        
        <div style="text-align: center; margin-top: 40px;">
            <a class="nav-btn" href="index.html" style="text-decoration: none;">Go Back Home</a>
        </div>
    </main>

    <script src="/assets/js/auth.js" defer></script>
    <script src="/assets/js/main.js" defer></script>
    <!-- New script specifically for forum logic -->
    <script src="/assets/js/forums.js" defer></script>
</body>
</html>
