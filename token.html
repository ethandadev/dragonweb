<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Web | Token Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <link rel="icon" href="/assets/images/dragonweb_icon.png">
    <style>
        .arcade-section {
            max-width: 52rem;
            margin: 0 auto;
            padding: var(--space-xl) var(--space-sm);
        }
        .arcade-balance {
            margin: var(--space-md) 0;
            padding: var(--space-md);
            background: var(--color-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            font-size: 1.2rem;
        }
        .arcade-games {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr));
            gap: var(--space-md);
        }
        .arcade-game {
            padding: var(--space-md);
            background: var(--color-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }
        .arcade-game h2 { margin-top: 0; }
        .arcade-game .cta-button { display: block; text-align: center; }
        .arcade-status { color: var(--color-text-muted); }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-logo"><img src="/assets/images/dragonweb_icon.png" alt="Dragon Web Home"></a>
        <a href="announcements.html">Announcements</a>
        <a href="forums.html">Forums</a>
        <a href="studentstuff.html">Student Stuff</a>
        <div class="navbar-auth">
            <div id="user-profile" class="profile-container hidden">
                <span id="avatar-img" class="avatar"></span>
                <span id="user-greeting"></span>
            </div>
            <a id="login-link" href="login.html" class="nav-btn">Login / Sign Up</a>
            <button id="logout-btn" class="nav-btn hidden" onclick="logout()">Logout</button>
        </div>
    </nav>

    <main class="arcade-section">
        <h1 class="title">Token Arcade</h1>
        <p class="subtitle">Unlock each game once with 1 token. Your teacher controls when unlocked games can be played.</p>
        <p class="form-error hidden" id="arcade-error" role="alert"></p>
        <div id="arcade-balance" class="arcade-balance">Loading your token balance…</div>
        <div id="arcade-games" class="arcade-games"></div>
    </main>

    <script src="/assets/js/auth.js" defer></script>
    <script src="/assets/js/token.js" defer></script>
</body>
</html>
