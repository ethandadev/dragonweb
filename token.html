<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework Token Arcade</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #121212; color: #fff; padding: 2rem; max-width: 600px; margin: 0 auto; }
        .card { background: #1e1e1e; padding: 1.5rem; margin-bottom: 1.5rem; border-radius: 8px; border: 1px solid #333; }
        .token-display { font-size: 2rem; font-weight: bold; color: #4caf50; }
        button { background: #007acc; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #005999; }
        button:disabled { background: #444; cursor: not-allowed; }
    </style>
</head>
<body>

     <header class="homwork-header">
        <h1 class="title">Turn in complete homeworks</h1>
        <p class="subtitle">This is were you turn in any completed homeworks (one time only!) to earn credits you can spend on our games!</p>
    </header>
    
    <h1> Homework Turn-In</h1>
    
    <!-- Token Balance Sheet -->
    <div class="card">
        <h3>Your Balance</h3>
        <div class="token-display"><span id="token-count">0</span> Tokens</div>
    </div>

    <!-- Upload Portal -->
    <div class="card">
        <h3>Upload Completed Homework</h3>
        <form id="upload-form">
            <input type="file" id="homework-file" required style="margin-bottom: 1rem; display: block;">
            <button type="submit">Submit for 1 Token</button>
            <button type="check.tokens"> Check Your Balance</button>
        </form>
    </div>

    <script src="app.js"></script>

</body>
</html>
